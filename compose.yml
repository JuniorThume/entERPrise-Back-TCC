services:
  database:
    hostname: localhost
    container_name: db_container
    image: postgres
    ports:
      - "5432:5432"
    expose:
      - 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    env_file:
      - .env
    networks:
      - app-network

  backend:
    container_name: "backend"
    image: "valmirthumejr/backend-tcc"
    volumes: 
      - .:/app
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      - "database"
    networks:
      - app-network
    
volumes:
  pgdata:

networks:
  app-network:
    driver: bridge

